name: Deploy by FTP

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *' # Täglich 04:00 UTC – hält den Kalender aktuell
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test calendar times and direct page URLs
        run: npm run test

      - name: Generate mail config
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          cat > ./build/anmeldung.config.php <<PHP
          <?php
          return [
              'smtp' => [
                  'host' => 'smtp.resend.com',
                  'port' => 465,
                  'encryption' => 'ssl',
                  'username' => 'resend',
                  'password' => '${RESEND_API_KEY}',
                  'ssl_verify_peer' => true,
              ],
          ];
          PHP

      - name: Upload via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          ssh_private_key: ${{ secrets.SFTP_PRIVATE_KEY }}
          port: ${{ secrets.SFTP_PORT || '22' }}
          local_path: ./build/*
          remote_path: ${{ secrets.SFTP_REMOTE_PATH }}
          sftp_only: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
