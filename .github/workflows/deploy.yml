name: Deploy by FTP

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *' # Täglich 04:00 UTC – hält den Kalender aktuell
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test calendar times and direct page URLs
        run: npm run test

      - name: Verify Pages artifact contains no SMTP credentials
        run: test ! -e build/anmeldung.config.php

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Generate mail config
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          cat > ./build/anmeldung.config.php <<PHP
          <?php
          return [
              'smtp' => [
                  'host' => 'smtp.resend.com',
                  'port' => 465,
                  'encryption' => 'ssl',
                  'username' => 'resend',
                  'password' => '${RESEND_API_KEY}',
                  'ssl_verify_peer' => true,
              ],
          ];
          PHP

      - name: Upload via SFTP
        uses: wlixcc/SFTP-Deploy-Action@a5ccb9c6211a94cc59404f0fdb2a9936a6dfee64 # v1.2.6
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          ssh_private_key: ${{ secrets.SFTP_PRIVATE_KEY }}
          port: ${{ secrets.SFTP_PORT || '22' }}
          local_path: ./build/*
          remote_path: ${{ secrets.SFTP_REMOTE_PATH }}
          sftp_only: true
